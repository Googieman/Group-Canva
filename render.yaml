# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: group-canvas
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server/server/index.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
